services:
  bondbot:
    build:
      context: .
      dockerfile: bondbot/Dockerfile
    image: platon-bond-bot:0.1.0
    env_file: .env
    environment:
      BONDBOT_DB_PATH: /data/bondbot.db
      BONDBOT_HEALTH_PORT: "8081"
    volumes:
      - ./bondbot-data:/data
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
