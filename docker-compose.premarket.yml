services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: platon-premarket-api:0.1.0
    env_file: .env
    environment:
      PREMARKET_ENVIRONMENT: production
      PREMARKET_DEMO_MODE: "1"
      PREMARKET_BOND_DB_PATH: /data/bondbot/bondbot.db
      PREMARKET_FREELANCE_DB_PATH: /freelance-data/bot.db
      PREMARKET_RISK_DB_PATH: /data/premarket/risk.db
      PREMARKET_CHAT_DB_PATH: /data/premarket/chat.db
      PREMARKET_SESSION_TTL_MINUTES: ${PREMARKET_SESSION_TTL_MINUTES:-120}
      PREMARKET_ADMIN_TOKEN: ${PREMARKET_ADMIN_TOKEN:-}
      PREMARKET_CORS_ORIGINS: https://platoninvest.pro
      PREMARKET_LLM_ENABLED: ${PREMARKET_LLM_ENABLED:-0}
      PREMARKET_OPENAI_API_KEY: ${BONDBOT_OPENAI_API_KEY:-}
      PREMARKET_OPENAI_BASE_URL: ${BONDBOT_OPENAI_BASE_URL:-https://api.aitunnel.ru/v1}
      PREMARKET_OPENAI_MODEL: ${BONDBOT_OPENAI_MODEL:-deepseek-v4.1-flash-1017}
      TZ: Europe/Moscow
    volumes:
      - ./bondbot-data:/data/bondbot:ro
      - ./premarket-data:/data/premarket
      - /opt/freelance-bot/data:/freelance-data:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    init: true
    mem_limit: 320m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
    image: platon-premarket-web:0.1.0
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE: ""
      TZ: Europe/Moscow
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    mem_limit: 320m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
